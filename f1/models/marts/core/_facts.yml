version: 2

models:
  - name: fct_race_results
    description: "Grain: one row per driver per race."
    columns:
      - name: result_key
        tests: [unique, not_null]
      - name: race_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_race')", field: race_key}
      - name: driver_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_driver')", field: driver_key}
      - name: constructor_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_constructor')", field: constructor_key}
      - name: race_date_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_date')", field: date_key}
      - name: points
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: grid_position
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: finish_position
        tests:
          - dbt_utils.accepted_range: {min_value: 1}

  - name: fct_qualifying
    description: "Grain: one row per driver per race (qualifying session)."
    columns:
      - name: qualifying_key
        tests: [unique, not_null]
      - name: race_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_race')", field: race_key}
      - name: driver_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_driver')", field: driver_key}
      - name: constructor_key
        tests:
          - relationships: {to: "ref('dim_constructor')", field: constructor_key}
      - name: race_date_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_date')", field: date_key}

  - name: fct_pit_stops
    description: "Grain: one row per pit stop."
    columns:
      - name: pit_stop_key
        tests: [unique, not_null]
      - name: race_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_race')", field: race_key}
      - name: driver_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_driver')", field: driver_key}
      - name: constructor_key
        description: Team from the race result; NULL if the result is not loaded.
        tests:
          - relationships:
              to: "ref('dim_constructor')"
              field: constructor_key
              config: {severity: warn}
      - name: duration_seconds
        tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: false}

  - name: fct_lap_times
    description: "Grain: one row per driver per lap per race. Incremental (merge)."
    columns:
      - name: lap_time_key
        tests: [unique, not_null]
      - name: race_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_race')", field: race_key}
      - name: driver_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_driver')", field: driver_key}
      - name: lap_time_seconds
        tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: false}
