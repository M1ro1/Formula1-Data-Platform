name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff sqlfluff-templater-dbt dbt-snowflake "apache-airflow>=2.8.0,<3.0.0" astronomer-cosmos pytest

      - name: Python Linting (Ruff)
        run: |
          ruff check airflow/ bi/ tests/

      - name: Airflow DAG Integrity Check
        env:
          PYTHONPATH: .
          DBT_PROJECT_PATH: ${{ github.workspace }}/f1
          AIRFLOW__CORE__UNIT_TEST_MODE: 'True'
          AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
        run: |
            pytest tests/test_dag_integrity.py

      - name: dbt Parse & Compile Check
        env:
          DBT_PROFILES_DIR: ./f1/airflow_profiles
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          cd f1
          dbt deps
          dbt parse
