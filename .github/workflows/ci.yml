name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff sqlfluff-templater-dbt dbt-snowflake "apache-airflow>=2.8.0,<3.0.0" astronomer-cosmos pytest

      - name: Python Linting (Ruff)
        run: |
          ruff check airflow/ bi/ tests/

